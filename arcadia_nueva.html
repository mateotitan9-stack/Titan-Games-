:linear-gradient(145deg,#eee2ff,#cebaff);border-color:#aa91eb}.option:nth-child(3n){background:linear-gradient(145deg,#fff0b9,#ffda76);border-color:#eabb40}.field{display:flex;gap:9px;flex-wrap:wrap}.answer{flex:1;min-width:150px;border:2px solid var(--line);border-radius:13px;padding:13px;outline:0}.feedback{margin-top:13px;padding:13px;border-radius:14px;background:#fff5c9;font-weight:850}.meter{height:13px;background:#dceefe;border-radius:99px;overflow:hidden;margin:13px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--violet));border-radius:inherit}.memory{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:17px auto}.memory button{aspect-ratio:1;border-radius:14px;background:linear-gradient(145deg,#7459e5,#bca8ff);color:#fff;font-weight:1000;font-size:1.45rem}.memory button.open{background:linear-gradient(145deg,#fff,#dff8ff);color:var(--ink);border:2px solid #8ad6ed}.settings{max-width:680px}.range{width:100%;accent-color:var(--violet)}.notice{padding:13px;border-radius:14px;background:#fff7d4;border:1px solid #ffe49a;color:#765d19;font-weight:750;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:15px 0}.stat{padding:14px;border:1px solid var(--line);background:#f7fbff;border-radius:14px;font-weight:850}.stat b{display:block;font-size:1.5rem;color:var(--violet)}@media(max-width:600px){.screen{padding-inline:12px}.lobby{gap:10px}.lobby button{min-height:125px;padding:15px}.lobby b{font-size:1.05rem}.options{grid-template-columns:1fr}.diffs{grid-template-columns:1fr}.memory{gap:6px}.memory button{font-size:1.05rem}}

quizTypes.push(...'Astronomía práctica|Historia antigua|Historia moderna|Geografía física|Geografía humana|Capitales|Banderas|Ciencia espacial|Física diaria|Química curiosa|Biología marina|Genética|Ecología urbana|Psicología social|Filosofía ética|Literatura mundial|Poesía|Teatro|Arquitectura famosa|Diseño|Fotografía|Animación|Series|Superhéroes|Música clásica|Rock|Música latina|Instrumentos|Cocina mexicana|Cocina asiática|Postres|Nutrición|Deportes olímpicos|Básquetbol|Béisbol|Tenis|Fórmula 1|Videojuegos retro|Videojuegos indie|Roblox avanzado|Minecraft|Nintendo|PlayStation|Xbox|Fisch experto|Criaturas marinas|Mitología griega|Mitología nórdica|Leyendas mexicanas|Misterios|Detectives|Criptografía|Internet|Programación web|Robótica|Inteligencia artificial|Inventos modernos|Medicina|Anatomía|Primeros auxilios|Cerebro|Idiomas|Gramática|Palabras|Economía|Finanzas|Emprendimiento|Derecho|Política|Sociedad|Cultura pop|Moda|Cine clásico|Cine de terror|Naturaleza extrema|Volcanes|Terremotos|Clima extremo|Astronautas|Exploración'.split('|').slice(0,75).map((x,i)=>[x,'extraq'+i]));mathTypes.push(...'Sumas avanzadas|Restas avanzadas|Multiplicación|División|Fracciones equivalentes|Fracciones mixtas|Decimales avanzados|Porcentajes|Descuentos|Interés|Proporciones|Regla de tres|Razones|Escalas|Ecuaciones|Ecuaciones lineales|Ecuaciones cuadráticas|Inecuaciones|Polinomios|Monomios|Factorización|Productos notables|Funciones|Pendientes|Coordenadas|Rectas|Ángulos|Triángulos|Cuadriláteros|Polígonos|Circunferencia|Círculo|Perímetro|Área|Volumen|Prismas|Pirámides|Cilindros|Conos|Esferas|Pitágoras|Semejanza|Congruencia|Trigonometría|Seno|Coseno|Tangente|Vectores|Matrices|Sistemas|Determinantes|Sucesiones|Sucesiones geométricas|Patrones|Raíces|Potencias|Logaritmos|Notación científica|MCD|MCM|Divisibilidad|Números primos|Números negativos|Valor absoluto|Promedios|Mediana|Moda|Rango|Probabilidad|Combinatoria|Permutaciones'.split('|').slice(0,75).map((x,i)=>[x,'extram'+i]));lifeTypes.push(...' const quizFacts={cosmos:['¿Qué planeta tiene anillos muy visibles?',['Saturno','Marte','Mercurio','Venus'],0],civilizations:['¿Qué civilización construyó Machu Picchu?',['Inca','Romana','Vikinga','Persa'],0],world:['¿Qué país tiene forma de bota?',['Italia','Canadá','India','Egipto'],0],digital:['¿Qué sistema traduce dominios a direcciones IP?',['DNS','GPS','USB','HTML'],0],gaming:['¿Qué es un roguelike?',['Partidas variables y reinicio al perder','Un juego sin reglas','Una consola','Un cable'],0],nature:['¿Qué proceso permite a las plantas fabricar alimento?',['Fotosíntesis','Erosión','Digestión animal','Combustión'],0],soccer:['¿Cuántos jugadores tiene un equipo en cancha?',['11','5','7','15'],0],cinema:['¿Qué organiza los planos de una película?',['Montaje','Brújula','Vestuario','Taquilla'],0],music:['¿Qué instrumento tiene teclas y cuerdas?',['Piano','Trompeta','Violín','Flauta'],0],cooking:['¿Qué reacción produce el dorado de muchos alimentos?',['Maillard','Ósmosis','Sublimación','Congelación'],0],mind:['¿Qué es un sesgo cognitivo?',['Un patrón que puede desviar un juicio','Un músculo','Una melodía','Un mapa'],0],body:['¿Qué órgano bombea la sangre?',['Corazón','Pulmón','Riñón','Piel'],0],inventions:['¿Qué componente sustituyó a muchas válvulas electrónicas?',['Transistor','Péndulo','Lupa','Brújula'],0],art:['¿Qué técnica usa luces y sombras intensas?',['Claroscuro','Collage','Rima','Perspectiva aérea'],0],books:['¿Qué es una metáfora?',['Una comparación implícita','Una fecha','Un índice','Un personaje'],0],myths:['¿Qué es el Ragnarök?',['El final de un ciclo nórdico','Un planeta','Una receta','Un torneo'],0],oceans:['¿Cuál es el océano más grande?',['Pacífico','Índico','Ártico','Atlántico'],0],climate:['¿Qué fuerza desvía el aire por la rotación terrestre?',['Coriolis','Fricción','Tensión','Capilaridad'],0],animals:['¿Qué grupo incluye pulpos y calamares?',['Cefalópodos','Arácnidos','Anélidos','Mamíferos'],0],mexico:['¿En qué año se promulgó la Constitución mexicana vigente?',['1917','1810','1492','1968'],0],space:['¿Qué es un exoplaneta?',['Un planeta fuera del sistema solar','Una estrella','Una galaxia','Un cometa'],0],economy:['¿Qué es la inflación?',['Aumento general de precios','Baja de todos los precios','Una moneda','Un impuesto único'],0],science:['¿Qué partícula determina el número atómico?',['Protones','Neutrones','Fotones','Moléculas'],0],futuretech:['¿Qué área estudia sistemas capaces de aprender patrones?',['Inteligencia artificial','Cartografía','Paleontología','Escultura'],0],detectives:['¿Qué es una coartada?',['Una prueba de dónde estaba alguien','Un arma','Una huella','Un secreto'],0]};
const lifePrompts=['¿Qué opción te ayuda más en esta situación?','¿Qué respuesta demuestra madurez?','¿Qué hábito suele construir mejores resultados?','¿Qué decisión cuida mejor tu bienestar?','¿Qué actitud abre una solución?','¿Qué harías primero para avanzar?'];
let state=load(),view='lobby',mode='',category='',game=null;
function defaults(){return{name:'Jugador',brightness:1,coins:0,played:0,streak:0}}
function load(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch(e){return defaults()}}
function save(){localStorage.setItem(SAVE,JSON.stringify(state))}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(label,to){return '<button class="back" data-nav="'+to+'">← '+label+'</button>'}
function render(){document.documentElement.style.setProperty('--brightness',state.brightness);const e=document.getElementById('screen');if(view==='lobby')lobby(e);else if(view==='modes')modes(e);else if(view==='topics')topics(e);else if(view==='difficulty')difficulty(e);else if(view==='play')play(e);else settings(e)}
function lobby(e){e.innerHTML='<section class="hero"><h1>¡Hola, '+esc(state.name)+'! ✨</h1><p>Cuatro aventuras nuevas, 100 categorías en cada modo.</p></section><div class="lobby"><button data-nav="modes"><i>🎮</i><b>Jugar</b><span class="small">Elige tu desafío</span></button><button data-nav="settings"><i>⚙️</i><b>Settings</b><span class="small">Bajar el brillo</span></button><button class="store-button" data-coming><i>🛒🔒</i><b>Tienda</b><span class="small">Próximamente</span></button></div><section class="panel"><div class="head"><h2>Tu progreso</h2><span class="small">🪙 '+state.coins+' · '+state.played+' partidas</span></div><div class="notice">Versión nueva desde cero: cuatro modos, sin PIN y con nombres totalmente diferentes.</div></section>'}
function modes(e){const a=[['🧠','Desafío Trivia','100 temas de preguntas','quiz'],['➗','Laboratorio Numérico','100 retos de matemáticas','math'],['💭','Historias de la Vida','100 temas para reflexionar','life'],['🃏','Memoria Mágica','100 tipos de baraja','cards']];e.innerHTML=nav('Lobby','lobby')+'<section class="panel"><div class="head"><div><h2>Elige un modo</h2><span class="small">Cada modo tiene 100 categorías.</span></div></div><div class="modes">'+a.map(x=>'<article class="card"><div class="emoji">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'. Mecánica propia y partidas de 6 rondas.</p><button class="go" data-mode="'+x[3]+'">Entrar</button></article>').join('')+'</div></section>'}
function topics(e){let a,title;if(mode==='quiz'){a=quizTypes;title='100 temas de Trivia'}else if(mode==='math'){a=mathTypes;title='100 retos numéricos'}else if(mode==='cards'){a=cardTypes;title='100 barajas de memoria'}else{a=lifeTypes;title='100 temas de Vida'}e.innerHTML=nav('Modos','modes')+'<section class="panel"><div class="head"><div><h2>'+title+'</h2><span class="small">Escoge una opción para continuar.</span></div></div><div class="topics">'+a.map(x=>'<button class="topic" data-category="'+x[1]+'">'+x[0]+'</button>').join('')+'</div></section>'}
function difficulty(e){e.innerHTML=nav('Categorías','topics')+'<section class="panel difficulty"><div class="emoji">'+(mode==='quiz'?'🧠':mode==='math'?'➗':mode==='cards'?'🃏':'💭')+'</div><h2>'+esc(label())+'</h2><p class="small">Todas las partidas tienen 6 rondas.</p><div class="diffs"><button class="diff" data-diff="easy">Fácil<small>Más ayuda</small></button><button class="diff" data-diff="normal">Normal<small>Reto equilibrado</small></button><button class="diff" data-diff="hard">Difícil<small>Máximo reto</small></button></div></section>'}
function label(){const a=mode==='quiz'?quizTypes:mode==='math'?mathTypes:mode==='cards'?cardTypes:lifeTypes;return a.find(x=>x[1]===category)[0]}
function shuffleQ(q,diff){let rows=q[1].map((text,i)=>({text,ok:i===q[2]}));if(diff==='easy')rows=rows.filter((x,i)=>x.ok||i===0);if(diff==='hard'&&rows.length<4)rows.push({text:'Ninguna de las anteriores',ok:false});rows.sort(()=>Math.random()-.5);return[q[0],rows.map(x=>x.text),rows.findIndex(x=>x.ok)]}
function makeQuiz(diff){const q=quizFacts[category]||['¿Qué se practica principalmente aquí?',[label(),'Cocina','Carreras','Música'],0];return Array.from({length:6},(_,i)=>shuffleQ([i<1?q[0]:lifePrompts[i]+' · '+label(),q[1],q[2]],diff))}
function makeLife(diff){const base=[['¿Qué suele ayudar en '+label()+'?',['Pensar, escuchar y actuar con respeto','Ignorar todo','Culpar a alguien'],0],['¿Qué opción es más constructiva?',['Dar un paso pequeño y claro','Esperar que se arregle solo','Rendirse de inmediato'],0]];return Array.from({length:6},(_,i)=>shuffleQ([base[i%2][0]+' · Reto '+(i+1),base[i%2][1],base[i%2][2]],diff))}
function start(diff){game={diff,total:6,round:0,score:0,feedback:'',done:false};if(mode==='quiz'){game.qs=makeQuiz(diff);game.i=0}else if(mode==='life'){game.qs=makeLife(diff);game.i=0}else if(mode==='cards'){const icons=Array.from(cardSymbols[cardTypes.findIndex(x=>x[1]===category)%cardSymbols.length]||cardSymbols[0]);game.cards=icons.concat(icons).sort(()=>Math.random()-.5).map(x=>({x,open:false,done:false}));game.first=null;game.second=null;game.matches=0;game.moves=0}else{game.used=[];newMath()}view='play';render()}
function newMath(){const t=category;let a=0,b=0,ans=0,q='';if(t==='add'){a=1+Math.floor(Math.random()*30);b=1+Math.floor(Math.random()*30);ans=a+b;q='¿Cuánto es '+a+' + '+b+'?'}else if(t==='fractions'){const d=2+Math.floor(Math.random()*8),n=1+Math.floor(Math.random()*(d-1));ans=(n/d*100).toFixed(0)+'%';q='¿Qué porcentaje representa '+n+'/'+d+'?'}else if(t==='linear'){const k=2+Math.floor(Math.random()*8),x=1+Math.floor(Math.random()*9),b0=Math.floor(Math.random()*10);ans=x;q='Resuelve '+k+'x + '+b0+' = '+(k*x+b0)}else if(t==='area'){a=2+Math.floor(Math.random()*12);b=2+Math.floor(Math.random()*12);ans=a*b;q='Área de rectángulo '+a+' × '+b+'?'}else if(t==='percent'){a=20+Math.floor(Math.random()*80);b=[10,20,25,50][Math.floor(Math.random()*4)];ans=a*b/100;q='¿Cuál es el '+b+'% de '+a+'?'}else if(t==='powers'){a=2+Math.floor(Math.random()*7);b=2+Math.floor(Math.random()*3);ans=Math.pow(a,b);q=a+' elevado a '+b+'?'}else if(t==='equations'){const x=2+Math.floor(Math.random()*8);ans=x;q='Si x + 4 = '+(x+4)+', ¿cuánto vale x?'}else if(t==='scale'){a=1+Math.floor(Math.random()*8);ans=a*100;q='En escala 1:100, '+a+' cm representan cuántos cm?'}else if(t==='ratio'){a=2+Math.floor(Math.random()*6);b=a*(2+Math.floor(Math.random()*4));const c=2+Math.floor(Math.random()*6);ans=b*c/a;q='Si '+a+' objetos cuestan '+b+', ¿cuánto cuestan '+c+'?'}else if(t==='negative'){a=-1-Math.floor(Math.random()*12);b=1+Math.floor(Math.random()*12);ans=a+b;q='¿Cuánto es ('+a+') + '+b+'?'}else if(t==='multiples'){a=2+Math.floor(Math.random()*8);ans=a*15;q='Menor múltiplo de '+a+' divisible entre 15?'}else if(t==='gcd'){a=8+Math.floor(Math.random()*18);b=6+Math.floor(Math.random()*16);const f=(x,y)=>y?f(y,x%y):x;ans=f(a,b);q='MCD de '+a+' y '+b+'?'}else if(t==='decimal'){a=(1+Math.random()*20).toFixed(1);b=(1+Math.random()*10).toFixed(1);ans=(+a+ +b).toFixed(1);q=a+' + '+b+' = ?'}else if(t==='units'){a=2+Math.floor(Math.random()*8);ans=a*1000;q=a+' km son cuántos metros?'}else if(t==='perimeter'){a=2+Math.floor(Math.random()*10);b=2+Math.floor(Math.random()*10);ans=2*(a+b);q='Perímetro de '+a+' × '+b+'?'}else if(t==='angles'){a=30+Math.floor(Math.random()*50);b=30+Math.floor(Math.random()*50);ans=180-a-b;q='Tercer ángulo si los otros son '+a+'° y '+b+'°?'}else if(t==='triangle'){a=2+Math.floor(Math.random()*10);b=2+Math.floor(Math.random()*10);ans=a*b/2;q='Área de triángulo base '+a+' y altura '+b+'?'}else if(t==='circle'){a=2+Math.floor(Math.random()*10);ans=2*a;q='Diámetro con radio '+a+'?'}else if(t==='coordinates'){a=1+Math.floor(Math.random()*5);b=a+2+Math.floor(Math.random()*6);ans=b-a;q='Distancia horizontal entre x='+a+' y x='+b+'?'}else if(t==='probability'){ans='1/4';q='Una bola roja entre 4: probabilidad de roja?'}else if(t==='average'){ans=6;q='Promedio de 4, 6 y 8?'}else if(t==='median'){ans=5;q='Mediana de 2, 5 y 9?'}else if(t==='sequence'){a=2+Math.floor(Math.random()*8);b=2+Math.floor(Math.random()*5);ans=a+b*4;q='Sigue: '+a+', '+(a+b)+', '+(a+2*b)+', '+(a+3*b)+', ?'}else if(t==='root'){a=2+Math.floor(Math.random()*10);ans=a;q='Raíz cuadrada de '+a*a+'?'}else{a=2+Math.floor(Math.random()*8);ans=a*100;q=a+' × 10² = ?'}if(game.used.includes(q))q+=' · Reto '+(game.used.length+1);game.used.push(q);game.math={q,ans};game.feedback=''}
function play(e){if(game.done){e.innerHTML=nav('Modos','modes')+'<section class="panel difficulty"><h2>¡Partida terminada! 🎉</h2><p class="question">Puntos: '+game.score+' · Premio: '+(10+game.score)+' 🪙</p><button class="primary" data-action="finish">Guardar y volver</button></section>';return}let body;if(mode==='cards'){body='<div class="meta"><span>Parejas '+game.matches+'/5</span><span>Intentos '+game.moves+'</span></div><div class="memory">'+game.cards.map((c,i)=>'<button class="'+(c.open||c.done?'open':'')+'" data-action="card" data-value="'+i+'">'+(c.open||c.done?c.x:'?')+'</button>').join('')+'</div><p class="small">Encuentra las cinco parejas de '+label()+'.</p>'}else if(mode==='math'){body='<div class="meta"><span>Ejercicio '+(game.round+1)+'/6</span><span>'+game.score+' pts</span></div><div class="question">'+game.math.q+'</div><div class="field"><input class="answer" id="answer" inputmode="decimal" placeholder="Tu respuesta"><button class="primary" data-action="math">Comprobar</button></div>'}else{const q=game.qs[game.i];body='<div class="meta"><span>Pregunta '+(game.i+1)+'/6</span><span>'+esc(label())+' · '+game.score+' pts</span></div><div class="question">'+esc(q[0])+'</div><div class="options">'+q[1].map((o,i)=>'<button class="option" data-action="answer" data-value="'+i+'">'+esc(o)+'</button>').join('')+'</div>'}e.innerHTML=nav('Salir','modes')+'<section class="panel">'+body+(game.feedback?'<div class="feedback">'+game.feedback+'</div>':'')+(mode==='cards'&&game.matches===5?'<button class="primary" data-action="finish">Terminar memoria</button>':'')+'</section>'}
function finish(){state.coins+=10+game.score;state.played++;save();game=null;view='lobby';render()}
function settings(e){e.innerHTML=nav('Lobby','lobby')+'<section class="panel settings"><h2>Settings</h2><p class="small">Por ahora solo puedes bajar el brillo de la pantalla.</p><label><strong>Brillo</strong><input class="range" id="brightness" type="range" min=".45" max="1" step=".01" value="'+state.brightness+'"></label></section>'}
function action(a,v){if(a==='name'){const x=(document.getElementById('name').value||'').trim();if(x){state.name=x;save();render()}}else if(a==='finish'){finish()}else if(a==='math'){const val=(document.getElementById('answer').value||'').trim();if(String(val)===String(game.math.ans)){game.score+=3;game.feedback='¡Correcto! ✅'}else game.feedback='Respuesta: '+game.math.ans;game.round++;if(game.round>=6)game.done=true;else newMath();render()}else if(a==='answer'){const q=game.qs[game.i],ok=+v===q[2];if(ok)game.score+=3;game.feedback=ok?'¡Correcto! ✅':'Respuesta: '+q[1][q[2]];game.i++;if(game.i>=6)game.done=true;render()}else if(a==='card'){const i=+v,c=game.cards[i];if(!c||c.open||c.done||game.second!==null)return;c.open=true;if(game.first===null){game.first=i;render();return}game.second=i;game.moves++;const x=game.cards[game.first];if(x.x===c.x){x.done=c.done=true;game.matches++;game.first=game.second=null;render()}else{render();setTimeout(()=>{if(game){x.open=c.open=false;game.first=game.second=null;render()}},650)}}}
let suppressClick=0;document.addEventListener('click',e=>{if(Date.now()<suppressClick)return;if(e.target.closest('[data-coming]')){alert('🛒🔒 Tienda: próximamente');return}const navEl=e.target.closest('[data-nav]');if(navEl){view=navEl.dataset.nav;mode='';category='';game=null;render();return}const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;view='topics';render();return}const c=e.target.closest('[data-category]');if(c){category=c.dataset.category;view='difficulty';render();return}const d=e.target.closest('[data-diff]');if(d){start(d.dataset.diff);return}const a=e.target.closest('[data-action]');if(a){action(a.dataset.action,a.dataset.value);return}});document.addEventListener('pointerup',e=>{if(e.pointerType==='touch'){const t=e.target.closest('[data-nav],[data-mode],[data-category],[data-diff],[data-action]');if(t){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));suppressClick=Date.now()+500}}},{passive:false});document.addEventListener('input',e=>{if(e.target.id==='brightness'){state.brightness=+e.target.value;save();render()}});render();
</script>
</body>
